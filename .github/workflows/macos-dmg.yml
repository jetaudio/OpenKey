name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Sources/OpenKey/engine/**'
      - 'Sources/OpenKey/macOS/**'
      - 'scripts/build-macos-dmg.sh'
      - '.github/workflows/macos-dmg.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify universal DMG
        run: bash scripts/build-macos-dmg.sh
      - name: Upload DMG and build information
        uses: actions/upload-artifact@v4
        with:
          name: OpenKey-macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 30
